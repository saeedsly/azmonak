# ---------------------------------------------------------------------
#  ازمونک — نمونه‌ی VirtualHost برای XAMPP (Apache)
#  نصب:
#    ۱) این محتوا را به C:\xampp\apache\conf\extra\httpd-vhosts.conf اضافه کنید
#    ۲) در C:\Windows\System32\drivers\etc\hosts اضافه کنید:
#           127.0.0.1 azmoonak.local
#    ۳) در XAMPP، Apache را Restart کنید
#    ۴) در .env مقدار APP_URL=http://azmoonak.local را بگذارید
# ---------------------------------------------------------------------

<VirtualHost *:80>
    ServerName azmoonak.local
    DocumentRoot "C:/azmoonak/web/dist"

    ProxyPreserveHost On
    ProxyRequests Off
    ProxyPreserveHost On

    # تمام درخواست‌ها به سرور Node روی پورت ۴۰۰۰ می‌رود
    ProxyPass        / http://127.0.0.1:4000/
    ProxyPassReverse / http://127.0.0.1:4000/

    # فایل‌های استاتیک (اختیاری و سریع‌تر)
    # ProxyPassMatch "^/assets/(.*)" http://127.0.0.1:4000/assets/$1

    ErrorLog "logs/azmoonak-error.log"
    CustomLog "logs/azmoonak-access.log" common
</VirtualHost>
