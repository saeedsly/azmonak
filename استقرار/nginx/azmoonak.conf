# ---------------------------------------------------------------------
#  ازمونک — نمونه‌ی پیکربندی Nginx
#  نصب:
#    sudo cp استقرار/nginx/azmoonak.conf /etc/nginx/sites-available/azmoonak
#    sudo ln -s /etc/nginx/sites-available/azmoonak /etc/nginx/sites-enabled/
#    sudo nginx -t && sudo systemctl reload nginx
# ---------------------------------------------------------------------

upstream azmoonak_app {
    server 127.0.0.1:4000;
    keepalive 32;
}

server {
    listen 80;
    listen [::]:80;
    server_name azmoonak.example.ir;      # دامنه یا IP سرور خود را بگذارید

    # مسیر فایل‌های بارگذاری‌شده (تصویر سوال و فایل پاسخ)
    client_max_body_size 30m;

    # انتقال به HTTPS (بعد از فعال شدن certbot این خط را از حالت کامنت خارج کنید)
    # return 301 https://$host$request_uri;

    access_log /var/log/nginx/azmoonak.access.log;
    error_log  /var/log/nginx/azmoonak.error.log;

    location / {
        proxy_pass         http://azmoonak_app;
        proxy_http_version 1.1;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_read_timeout 300s;   # برای درخواست‌های هوش مصنوعی (تا ۱۲۰ ثانیه)
        proxy_send_timeout 300s;
        proxy_connect_timeout 30s;
    }

    # فایل‌های آپلودی (می‌توانید مستقیم سرو شوند تا سبک‌تر باشد)
    # location /uploads/ {
    #     alias /opt/azmoonak/server/data/uploads/;
    #     expires 7d;
    # }
}

